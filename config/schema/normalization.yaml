version: 1
currency_from_text:
  - pattern: "российск(ий|ая|ое|ие|их)\\s+рубл"
    code: RUB
  - pattern: "рубл(ь|я|ей|ях)\\s+Российской\\s+Федерации"
    code: RUB
  - pattern: "\\bRUB\\b"
    code: RUB
  - pattern: "доллар(ов|а|ы)?\\s+США"
    code: USD
  - pattern: "\\bUSD\\b"
    code: USD
  - pattern: "евро"
    code: EUR
  - pattern: "\\bEUR\\b"
    code: EUR

boolean_true:
  - "являются ценными бумагами, предназначенными для квалифицированных"
  - "предназначены для квалифицированных инвесторов"
  - "да"
boolean_false:
  - "не являются ценными бумагами, предназначенными для квалифицированных"
  - "не являются и не могут являться ценными бумагами, предназначенными"
  - "нет"

# Явные запреты: отсутствие совпадения не даёт false.
absence_is_not_false: true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cki-emission-parser"
version = "0.1.0"
description = "Извлечение параметров выпуска из эмиссионной документации для ЦКИ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "pillow>=10.0"]
dev = ["pytest>=8.0"]

[project.scripts]
cki-parse = "cki_emission_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
